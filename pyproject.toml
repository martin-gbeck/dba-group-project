[project]
name = "spot-price-forecast"
version = "0.1.0"
description = "DBA3803: forecasting the German day-ahead spot price to schedule industrial electricity purchases"
readme = "project.md"
authors = [
    { name = "martin-gbeck", email = "martingribsholt@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandera[polars]>=0.34.1",
    "plotnine>=0.15.8",
    "polars>=1.44.2",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "ruff>=0.17.0",
]
